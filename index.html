<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหารที่ชอบ - ทัศดนัย หอมหวล</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 32px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .greeting {
            color: #00d2ff;
            font-size: 0.95rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            color: #ffffff;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 1rem;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .info-list li {
            background-color: #262626;
            margin-bottom: 12px;
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .label {
            color: #00d2ff;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .value {
            font-weight: 600;
            color: #ffffff;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="greeting">My Favorite Food Lab 🍽️</div>
        <h1>เมนูอาหารที่ชอบที่สุด</h1>
        <div class="subtitle">โดย ทัศดนัย หอมหวล • เทคโนโลยีสารสนเทศ ปวส. 2</div>

        <ul class="info-list">
            <li>
                <span class="label">อันดับที่ 1 🥇</span>
                <span class="value">ข้าวกะเพราหมูกรอบ</span>
            </li>
            <li>
                <span class="label">อันดับที่ 2 🥈</span>
                <span class="value">หมูกระทะ</span>
            </li>
            <li>
                <span class="label">อันดับที่ 3 🥉</span>
                <span class="value">ข้าวผัดกุ้ง</span>
            </li>
        </ul>

        <div class="footer">Repository: fav-food-lab • GitHub Lab</div>
    </div>

</body>
</html>
